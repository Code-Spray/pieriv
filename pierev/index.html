<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icons/logo.ico">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <div class="nav_and_logo">
            <a href="index.html"><img src="images/logo.png" style="width: 70px; height: 70px;" alt="loading..."></a>
            <nav>
                <ul>
                    <li class="nav_li"><a href="index.html"><img src="icons/home.png" class="nav_icon">Home</a></li>
                    <li class="nav_li"><a href="all_menu.html"><img src="icons/menu.png" class="nav_icon">All Menu</a></li>
                    <li class="nav_li"><a href="favorite.html"><img src="icons/heart.png" class="nav_icon">Favorite</a></li>
                    <li class="nav_li"><a href="cart.html"><img src="icons/cart.png" class="nav_icon">Cart</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="landing">
            <div class="greet">
                <p class="welcome">welcome to pirev</p>
                <p class="description">The home of italian pizza</p>
                <a href="all_menu.html" class="landing_button">Menu</a>
            </div>
            <img class="landing_image" src="images/landing.png">
        </div>
        <div class="types_contaner">
            <p id="type_most" class="active">Most Ordered</p>
            <p id="type_new" class="inactive">New</p>
            <p id="type_fav" class="inactive">Favorite</p>
        </div>
        <div class="cards_container">
            <div class="card">
                <img src="images/Pepperoni pizza new.avif"alt="Pepperoni">
                <div class="info">
                    <p class="product_name">Pepperoni</p>
                    <p class="product_price">20⃁</p>
                    <div class="icons_container">
                        <i class="bi bi-heart"></i>
                        <i class="bi bi-cart2"></i>
                    </div>
                </div>
            </div>
            <div class="card">
                <img src="images/Margherita Pizza.jpeg"alt="Margherita">
                <div class="info">
                    <p class="product_name">Margherita</p>
                    <p class="product_price">35⃁</p>
                    <div class="icons_container">
                        <i class="bi bi-heart"></i>
                        <i class="bi bi-cart2"></i>
                    </div>
                </div>
            </div>
            <div class="card">
                <img src="images/quattro-formaggi-pizza-12.jpg"alt="quattro-formaggi-pizza">
                <div class="info">
                    <p class="product_name">Quattro Formaggi</p>
                    <p class="product_price">50⃁</p>
                    <div class="icons_container">
                        <i class="bi bi-heart"></i>
                        <i class="bi bi-cart2"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/global.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
